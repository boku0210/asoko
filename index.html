    #fcfcfb 40%,
    #f9f9f7 70%,
    #f4f4f1 100%

}

  transform: translateX(-105%);

}

.stats-close-btn:focus-visible {

}

  .wall-left {

}
</style>
</head>
<body>

<div class="wrap">
  <p class="instruction" id="instruction">この部屋から最短で<br>その部屋へ向かってください。</p>

  <div class="stage" id="stage" aria-live="polite">
    <div class="stage-container" id="stageContainer">
      <div class="room" id="room">
        <div class="room-box" id="roomBox">
          <div class="wall wall-ceiling"></div>
          <div class="wall wall-floor"></div>
          <div class="wall wall-left"></div>
          <div class="wall wall-right"></div>
          <div class="wall wall-back"></div>

          <div class="room-debug-label" id="roomDebug" hidden></div>

          <button class="door door-front" id="doorFront" type="button" aria-label="正面の扉" hidden>
            <div class="door-shell">
              <div class="door-track"></div>
              <div class="door-panel door-panel-left"></div>
              <div class="door-panel door-panel-right"></div>
              <div class="door-gap"></div>
            </div>
          </button>

          <button class="door door-left" id="doorLeft" type="button" aria-label="左の扉" hidden>
            <div class="door-shell">
              <div class="door-track"></div>
              <div class="door-panel door-panel-left"></div>
              <div class="door-panel door-panel-right"></div>
              <div class="door-gap"></div>
            </div>
          </button>

          <button class="door door-right" id="doorRight" type="button" aria-label="右の扉" hidden>
            <div class="door-shell">
              <div class="door-track"></div>
              <div class="door-panel door-panel-left"></div>
              <div class="door-panel door-panel-right"></div>
              <div class="door-gap"></div>
            </div>
          </button>

          <div class="door-hit-left" id="doorHitLeft"></div>
          <div class="door-hit-right" id="doorHitRight"></div>

          <div class="room-hiragana-layer" id="hiraganaLayer"></div>
        </div>
        <div class="ceiling-overlay"></div>
      </div>
      <div class="stage-frame" id="stageFrame"></div>
      <button class="step-indicator" id="stepIndicator" type="button" aria-label="ステップ 1 / 2">1/2</button>
    </div>
  </div>

  <div class="bottom-ui">
    <div class="bottom-buttons">
      <button class="reset-btn" id="resetBtn" type="button">この部屋に戻る</button>
      <button class="reset-from-stage2-btn" id="resetFromStage2Btn" type="button">はじめから遊ぶ</button>
    </div>
  </div>
</div>

<div class="clear-overlay" id="clearOverlay">
  <div class="clear-inner">
    <p class="clear-step" id="clearStep"></p>
    <p class="clear-text" id="clearText">あなたはそこの部屋を巡った。</p>
    <div class="clear-buttons">
      <button class="again-btn" id="againBtn" type="button">次へ</button>
      <button class="share-btn" id="shareBtn" type="button">シェアする</button>
    </div>
  </div>
</div>

<div class="goal-message" id="goalMessage">
  <p class="goal-message-text" id="goalMessageText">あの部屋を経由してください</p>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-inner">
    <p class="confirm-text">本当にはじめから遊びますか？</p>
    <div class="confirm-buttons">
      <button class="confirm-btn confirm-btn-yes" id="confirmYesBtn" type="button">はい</button>
      <button class="confirm-btn" id="confirmNoBtn" type="button">いいえ</button>
    </div>
  </div>
</div>

<div class="stats-overlay" id="statsOverlay" role="dialog" aria-modal="true" aria-labelledby="statsTitle" aria-hidden="true">
  <div class="stats-inner">
    <h2 class="stats-title" id="statsTitle">プレイ記録</h2>

    <p class="stats-status" id="statsStatus">読み込み中…</p>

    <div class="stats-data" id="statsData" hidden>
      <div class="stats-row">
        <span>プレイ回数</span>
        <strong id="statsTotalPlays">0</strong>
      </div>

      <div class="stats-row">
        <span>STEP 1 クリア数</span>
        <strong id="statsStep1Clears">0</strong>
      </div>

      <div class="stats-row">
        <span>STEP 2 クリア数</span>
        <strong id="statsStep2Clears">0</strong>
      </div>

      <div class="stats-row">
        <span>クリア率</span>
        <strong id="statsClearRate">0%</strong>
      </div>

      <p class="stats-note">クリア率＝STEP 2クリア数 ÷ プレイ回数。全体の目安です。</p>
    </div>

    <button class="stats-close-btn" id="statsCloseBtn" type="button">閉じる</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var GRID = [
    ['ん', 'わ', 'ら', 'や', 'ま', 'は', 'な', 'た', 'さ', 'か', 'あ'],
    [null, null, 'り', null, 'み', 'ひ', 'に', 'ち', 'し', 'き', 'い'],
    [null, null, 'る', 'ゆ', 'む', 'ふ', 'ぬ', 'つ', 'す', 'く', 'う'],
    [null, null, 'れ', null, 'め', 'へ', 'ね', 'て', 'せ', 'け', 'え'],
    [null, 'を', 'ろ', 'よ', 'も', 'ほ', 'の', 'と', 'そ', 'こ', 'お']
  ];

  var ROWS = GRID.length;
  var COLS = GRID[0].length;
  var STORAGE_KEY = 'asoko_mode_v1';
  var SUPABASE_URL = 'https://pxliunzyzeoozwlwjsxp.supabase.co';
  var SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_SaPVGogcN8YDfXn8qj1fuQ_5svwlNiq';
  var BUILD_LABEL = 'build v7.0';
  var DEBUG_LABELS = false;
  var HIRAGANA_VISIBLE = false;
  var OPEN_MS = 1200;

  var DELTAS = [
    { dr: -1, dc: 0 },
    { dr: 0, dc: 1 },
    { dr: 1, dc: 0 },
    { dr: 0, dc: -1 }
  ];

  function findCell(letter) {
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        if (GRID[r][c] === letter) return { row: r, col: c };
      }
    }
    return null;
  }

  var START = findCell('こ');
  var VIA = findCell('あ');
  var GOAL = findCell('そ');
  var SHORTEST = 0;
  var state;
  var moving = false;
  var currentMode = 1;

  // STEP 1で最初の扉を押したか。部屋に戻っても変更しない。
  var playRecorded = false;
  var modeClearRecorded = false;

  var indicatorTapCount = 0;
  var indicatorTapFeedbackTimer = null;

  function getCell(r, c) {
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
    return GRID[r][c];
  }

  function isRoom(r, c) {
    return getCell(r, c) !== null;
  }

  function freshState() {
    return {
      row: START.row,
      col: START.col,
      facing: 0,
      moveCount: 0,
      visitedVia: false,
      goalMessage: null
    };
  }

  function loadMode() {
    try {
      return localStorage.getItem(STORAGE_KEY) === '2' ? 2 : 1;
    } catch (e) {
      return 1;
    }
  }

  function saveMode() {
    try {
      localStorage.setItem(STORAGE_KEY, String(currentMode));
    } catch (e) { }
  }

  function roomName(st) {
    return getCell(st.row, st.col);
  }

  var EXIT_OVERRIDES = {
    'わ': ['front'],
    'を': [],
    'ん': []
  };

  function canMoveTo(st, nr, nc) {
    var dest = getCell(nr, nc);
    if (dest === null) return false;
    return true;
  }

  function standardMoves(st) {
    var defs = [
      { kind: 'front', dir: st.facing },
      { kind: 'left', dir: (st.facing + 3) % 4 },
      { kind: 'right', dir: (st.facing + 1) % 4 }
    ];
    var out = [];
    for (var i = 0; i < defs.length; i++) {
      var d = defs[i].dir;
      var nr = st.row + DELTAS[d].dr;
      var nc = st.col + DELTAS[d].dc;
      if (canMoveTo(st, nr, nc)) {
        out.push({ kind: defs[i].kind, dir: d, row: nr, col: nc });
      }
    }
    return out;
  }

  function availableMoves(st) {
    var name = roomName(st);
    var override = EXIT_OVERRIDES[name];
    if (!override) return standardMoves(st);

    var defs = {
      front: st.facing,
      left: (st.facing + 3) % 4,
      right: (st.facing + 1) % 4
    };
    var out = [];
    for (var i = 0; i < override.length; i++) {
      var item = override[i];
      var kind = typeof item === 'string' ? item : item.kind;
      var d = (item && typeof item.absDir === 'number') ? item.absDir : defs[kind];
      var nr = st.row + DELTAS[d].dr;
      var nc = st.col + DELTAS[d].dc;
      if (canMoveTo(st, nr, nc)) {
        out.push({ kind: kind, dir: d, row: nr, col: nc });
      }
    }
    return out;
  }

  function moveMap(st) {
    var m = { front: null, left: null, right: null };
    var list = availableMoves(st);
    for (var i = 0; i < list.length; i++) m[list[i].kind] = list[i];
    return m;
  }

  function key(r, c, f) {
    return ((r * COLS) + c) * 4 + f;
  }

  function bfsDist(startState) {
    var dist = [];
    for (var i = 0; i < ROWS * COLS * 4; i++) dist[i] = -1;

    var q = [];
    var startKey = key(startState.row, startState.col, startState.facing);
    dist[startKey] = 0;
    q.push(startKey);

    for (var head = 0; head < q.length; head++) {
      var cur = q[head];
      var f = cur % 4;
      var rc = (cur - f) / 4;
      var c = rc % COLS;
      var r = (rc - c) / COLS;
      var here = { row: r, col: c, facing: f };
      var nexts = availableMoves(here);
      for (var j = 0; j < nexts.length; j++) {
        var mv = nexts[j];
        var nk = key(mv.row, mv.col, mv.dir);
        if (dist[nk] === -1) {
          dist[nk] = dist[cur] + 1;
          q.push(nk);
        }
      }
    }
    return dist;
  }

  function shortestTotal() {
    var d = bfsDist({ row: START.row, col: START.col, facing: 0 });
    var best = Infinity;
    for (var vf = 0; vf < 4; vf++) {
      var toVia = d[key(VIA.row, VIA.col, vf)];
      if (toVia === -1) continue;
      var viaState = { row: VIA.row, col: VIA.col, facing: vf };
      var dv = bfsDist(viaState);
      for (var gf = 0; gf < 4; gf++) {
        var toGoal = dv[key(GOAL.row, GOAL.col, gf)];
        if (toGoal === -1) continue;
        if (toVia + toGoal < best) best = toVia + toGoal;
      }
    }
    return best;
  }

  var instructionEl = document.getElementById('instruction');
  var stepIndicatorEl = document.getElementById('stepIndicator');
  var roomBoxEl = document.getElementById('roomBox');
  var roomDebugEl = document.getElementById('roomDebug');
  var hiraganaLayerEl = document.getElementById('hiraganaLayer');
  var doorFrontEl = document.getElementById('doorFront');
  var doorLeftEl = document.getElementById('doorLeft');
  var doorRightEl = document.getElementById('doorRight');
  var doorHitLeftEl = document.getElementById('doorHitLeft');
  var doorHitRightEl = document.getElementById('doorHitRight');

  var resetBtn = document.getElementById('resetBtn');
  var clearOverlay = document.getElementById('clearOverlay');
  var clearStepEl = document.getElementById('clearStep');
  var clearTextEl = document.getElementById('clearText');
  var againBtn = document.getElementById('againBtn');
  var shareBtn = document.getElementById('shareBtn');
  var goalMessageEl = document.getElementById('goalMessage');
  var goalMessageTextEl = document.getElementById('goalMessageText');
  var resetFromStage2Btn = document.getElementById('resetFromStage2Btn');
  var confirmOverlay = document.getElementById('confirmOverlay');
  var confirmYesBtn = document.getElementById('confirmYesBtn');
  var confirmNoBtn = document.getElementById('confirmNoBtn');
  var doorEls = { front: doorFrontEl, left: doorLeftEl, right: doorRightEl };

  var statsOverlayEl = document.getElementById('statsOverlay');
  var statsStatusEl = document.getElementById('statsStatus');
  var statsDataEl = document.getElementById('statsData');
  var statsTotalPlaysEl = document.getElementById('statsTotalPlays');
  var statsStep1ClearsEl = document.getElementById('statsStep1Clears');
  var statsStep2ClearsEl = document.getElementById('statsStep2Clears');
  var statsClearRateEl = document.getElementById('statsClearRate');
  var statsCloseBtn = document.getElementById('statsCloseBtn');

  function sendStatsRequest(functionName, parameters) {
    return fetch(SUPABASE_URL + '/rest/v1/rpc/' + functionName, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_PUBLISHABLE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(parameters)
    }).then(function (response) {
      if (!response.ok) {
        return response.text().then(function (detail) {
          throw new Error('集計への接続に失敗しました (' + response.status + '): ' + detail);
        });
      }
      return response.text().then(function (text) {
        return text ? JSON.parse(text) : null;
      });
    });
  }

  function recordGameEvent(step, eventName) {
    sendStatsRequest('asoko_record_event', {
      p_step: step,
      p_event: eventName
    }).catch(function (error) {
      console.warn(error);
    });
  }

  function countIndicatorTap() {
    indicatorTapCount += 1;

    stepIndicatorEl.classList.add('tapped');
    if (indicatorTapFeedbackTimer !== null) {
      window.clearTimeout(indicatorTapFeedbackTimer);
    }

    indicatorTapFeedbackTimer = window.setTimeout(function () {
      stepIndicatorEl.classList.remove('tapped');
      indicatorTapFeedbackTimer = null;
    }, 220);

    if (indicatorTapCount >= 5) {
      indicatorTapCount = 0;
      showStats();
    }
  }

  function formatCount(value) {
    var number = Number(value);
    return Number.isFinite(number) && number >= 0
      ? number.toLocaleString('ja-JP')
      : '0';
  }

  function showStats() {
    statsOverlayEl.classList.add('show');
    statsOverlayEl.setAttribute('aria-hidden', 'false');
    statsStatusEl.textContent = '読み込み中…';
    statsStatusEl.hidden = false;
    statsDataEl.hidden = true;

    sendStatsRequest('asoko_get_stats', {}).then(function (data) {
      if (!statsOverlayEl.classList.contains('show')) return;

      if (!data) throw new Error('集計データが見つかりません');

      var plays = Number(data.step1_plays) || 0;
      var step1Clears = Number(data.step1_clears) || 0;
      var step2Clears = Number(data.step2_clears) || 0;
      var clearRate = plays > 0
        ? (step2Clears / plays * 100).toFixed(1) + '%'
        : '0%';

      statsTotalPlaysEl.textContent = formatCount(plays);
      statsStep1ClearsEl.textContent = formatCount(step1Clears);
      statsStep2ClearsEl.textContent = formatCount(step2Clears);
      statsClearRateEl.textContent = clearRate;

      statsStatusEl.hidden = true;
      statsDataEl.hidden = false;
    }).catch(function (error) {
      console.warn(error);
      if (statsOverlayEl.classList.contains('show')) {
        statsStatusEl.textContent =
          '集計を読み込めませんでした。少し待ってから開き直してください。';
      }
    });
  }

  function hideStats() {
    statsOverlayEl.classList.remove('show');
    statsOverlayEl.setAttribute('aria-hidden', 'true');
  }

  function clearDoorAnimation() {
    doorFrontEl.classList.remove('opening');
    doorLeftEl.classList.remove('opening');
    doorRightEl.classList.remove('opening');
  }

  function updateHiraganaVisibility() {
    var color = HIRAGANA_VISIBLE ? 'rgba(0, 0, 0, 0.3)' : 'transparent';
    document.documentElement.style.setProperty('--hiragana-visibility', color);
  }

  function updateButtonVisibility() {
    if (state.row === START.row && state.col === START.col) {
      resetBtn.classList.add('hidden');
    } else {
      resetBtn.classList.remove('hidden');
    }
  }

  function render() {
    var currentRoom = roomName(state) || '';

    if (roomDebugEl) {
      roomDebugEl.textContent = DEBUG_LABELS ? currentRoom : '';
      roomDebugEl.hidden = !DEBUG_LABELS;
    }

    if (hiraganaLayerEl) {
      hiraganaLayerEl.textContent = currentRoom;
    }

    var doors = moveMap(state);

    doorFrontEl.hidden = !doors.front;
    doorLeftEl.hidden = !doors.left;
    doorRightEl.hidden = !doors.right;

    doorHitLeftEl.style.display = !doors.left ? 'none' : 'block';
    doorHitRightEl.style.display = !doors.right ? 'none' : 'block';

    updateButtonVisibility();
  }

  function showClear() {
    clearOverlay.classList.add('show');
  }

  function hideClear() {
    clearOverlay.classList.remove('show');
  }

  function updateUIForMode() {
    if (currentMode === 2) {
      resetFromStage2Btn.classList.add('show');
    } else {
      resetFromStage2Btn.classList.remove('show');
    }

    stepIndicatorEl.textContent = currentMode + '/2';
    stepIndicatorEl.setAttribute('aria-label', 'ステップ ' + currentMode + ' / 2');
    indicatorTapCount = 0;
  }

  function getShareText() {
    if (currentMode === 1) {
      return 'Web謎「そこ」を解いた\n私は「そこの部屋」を巡った\nhttps://boku0210.github.io/asoko/\n#あそこ謎';
    } else {
      return 'Web謎「あそこ」を解いた\n私は「あそこの部屋」を巡った\nhttps://boku0210.github.io/asoko/\n#あそこ謎';
    }
  }

  function share() {
    var text = getShareText();
    var url = 'https://boku0210.github.io/asoko/';
    var twitterUrl = 'https://twitter.com/intent/tweet?text='
      + encodeURIComponent(text)
      + '&url=' + encodeURIComponent(url);
    window.open(twitterUrl, '_blank', 'width=550,height=420');
  }

  function showGoalMessage(text) {
    goalMessageTextEl.textContent = text;
    goalMessageEl.classList.add('show');
  }

  function hideGoalMessage() {
    goalMessageEl.classList.remove('show');
  }

  function showConfirm() {
    confirmOverlay.classList.add('show');
  }

  function hideConfirm() {
    confirmOverlay.classList.remove('show');
  }

  function checkDeadEnd() {
    var currentRoom = roomName(state);
    if (currentRoom === 'を' || currentRoom === 'ん') {
      showGoalMessage('ここから先に部屋はありません');
      return true;
    }
    return false;
  }

  function recordClearOnce() {
    if (modeClearRecorded) return;
    modeClearRecorded = true;
    recordGameEvent(currentMode, 'clear');
  }

  function checkGoal() {
    if (state.row === GOAL.row && state.col === GOAL.col) {
      if (currentMode === 1) {
        if (state.moveCount !== 1) {
          showGoalMessage('最短経路ではありません');
        } else {
          recordClearOnce();
          clearStepEl.textContent = 'STEP 1 CLEAR';
          clearTextEl.textContent = 'あなたは「そこの部屋」を巡った。';
          againBtn.textContent = '次へ';
          showClear();
          updateUIForMode();
        }
      } else if (currentMode === 2) {
        if (!state.visitedVia) {
          showGoalMessage('あの部屋を経由してください');
        } else if (state.moveCount !== SHORTEST) {
          showGoalMessage('最短経路ではありません');
        } else {
          recordClearOnce();
          clearStepEl.textContent = 'ALL CLEAR';
          clearTextEl.textContent = 'あなたは「あそこの部屋」を巡った。';
          againBtn.textContent = 'もう一度あそぶ';
          showClear();
          updateUIForMode();
        }
      }
    }
  }

  function applyMove(mv) {
    state.row = mv.row;
    state.col = mv.col;
    state.facing = mv.dir;
    state.moveCount += 1;

    if (state.row === VIA.row && state.col === VIA.col) {
      state.visitedVia = true;
    }

    if (!checkDeadEnd()) {
      checkGoal();
    }

    render();
  }

  function pressDoor(kind) {
    if (moving) return;

    var mv = moveMap(state)[kind];
    if (!mv) return;

    if (currentMode === 1 && !playRecorded) {
      playRecorded = true;
      recordGameEvent(1, 'play');
    }

    moving = true;
    hideGoalMessage();

    clearDoorAnimation();
    var door = doorEls[kind];
    if (door) door.classList.add('opening');

    window.setTimeout(function () {
      roomBoxEl.style.filter = 'blur(3px) brightness(0.9)';

      window.setTimeout(function () {
        applyMove(mv);

        window.setTimeout(function () {
          roomBoxEl.style.filter = 'blur(0) brightness(1)';
          clearDoorAnimation();
          moving = false;
        }, 300);
      }, 50);
    }, OPEN_MS - 100);
  }

  function pressDoorWithoutFloorCheck(kind) {
    pressDoor(kind);
  }

  function performResetAnimation() {
    if (moving) return;

    moving = true;
    hideGoalMessage();

    roomBoxEl.style.filter = 'blur(3px) brightness(0.9)';

    window.setTimeout(function () {
      state = freshState();
      hideClear();
      updateUIForMode();
      render();

      window.setTimeout(function () {
        roomBoxEl.style.filter = 'blur(0) brightness(1)';
        moving = false;
      }, 300);
    }, 50);
  }

  function resetGame() {
    performResetAnimation();
  }

  function nextMode() {
    if (moving) return;

    if (currentMode === 1) {
      currentMode = 2;
      instructionEl.innerHTML =
        'この部屋から最短であの部屋を経由して<br>その部屋へ向かってください。';
    } else {
      currentMode = 1;
      instructionEl.innerHTML =
        'この部屋から最短で<br>その部屋へ向かってください。';
    }

    playRecorded = false;
    modeClearRecorded = false;

    saveMode();
    updateUIForMode();
    performResetAnimation();
  }

  function resetToStage1() {
    if (moving) return;

    currentMode = 1;
    instructionEl.innerHTML =
      'この部屋から最短で<br>その部屋へ向かってください。';

    playRecorded = false;
    modeClearRecorded = false;

    saveMode();
    updateUIForMode();
    performResetAnimation();
  }

  function toggleHiraganaVisibility() {
    HIRAGANA_VISIBLE = !HIRAGANA_VISIBLE;
    updateHiraganaVisibility();
    console.log('ひらがな表示: ' + (HIRAGANA_VISIBLE ? 'ON' : 'OFF'));
  }

  window.toggleHiraganaVisibility = toggleHiraganaVisibility;

  doorFrontEl.addEventListener('click', function () { pressDoor('front'); });
  doorLeftEl.addEventListener('click', function () { pressDoorWithoutFloorCheck('left'); });
  doorRightEl.addEventListener('click', function () { pressDoorWithoutFloorCheck('right'); });
  doorHitLeftEl.addEventListener('click', function () { pressDoorWithoutFloorCheck('left'); });
  doorHitRightEl.addEventListener('click', function () { pressDoorWithoutFloorCheck('right'); });

  resetBtn.addEventListener('click', resetGame);
  againBtn.addEventListener('click', nextMode);
  shareBtn.addEventListener('click', share);

  resetFromStage2Btn.addEventListener('click', showConfirm);
  confirmYesBtn.addEventListener('click', function () {
    hideConfirm();
    resetToStage1();
  });
  confirmNoBtn.addEventListener('click', hideConfirm);

  stepIndicatorEl.addEventListener('click', countIndicatorTap);
  statsCloseBtn.addEventListener('click', hideStats);

  statsOverlayEl.addEventListener('click', function (event) {
    if (event.target === statsOverlayEl) hideStats();
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && statsOverlayEl.classList.contains('show')) {
      hideStats();
    }
  });

  SHORTEST = shortestTotal();
  currentMode = loadMode();
  state = freshState();

  if (currentMode === 2) {
    instructionEl.innerHTML =
      'この部屋から最短であの部屋を経由して<br>その部屋へ向かってください。';
  }

  updateHiraganaVisibility();
  updateUIForMode();
  render();
})();
</script>

</body>
</html>

<style>
:root {
  --white-base: #f9f9f8;
  --white-light: #ffffff;
  --gray-shadow: rgba(160, 160, 160, 0.12);
  --gray-edge: rgba(140, 140, 140, 0.10);
  --text-main: rgba(60, 60, 60, 0.8);
  --text-sub: rgba(100, 100, 100, 0.5);
  --wall-back-width: 40%;
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100vh;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: var(--white-base);
  color: var(--text-main);
  font-family: "Noto Sans JP", sans-serif;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}

.wrap {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: var(--white-base);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.instruction {
  position: relative;
  z-index: 100;
  padding: max(16px, env(safe-area-inset-top)) 20px 12px;
  text-align: center;
  font-size: clamp(14px, 2vw, 18px);
  line-height: 1.8;
  letter-spacing: 0.02em;
  color: #000000;
  pointer-events: none;
  font-weight: 400;
  flex-shrink: 0;
  background: #ffffff;
  min-height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: normal;
}

h1 {
  display: none;
}

.stage {
  position: relative;
  flex: 1;
  width: 100%;
  overflow: hidden;
  background: 
    linear-gradient(180deg, 
      #fefefe 0%,
      #fbfbf9 25%,
      #f8f8f6 50%,
      #f5f5f2 75%,
      #f0f0ed 100%
    );
  aspect-ratio: 16 / 9;
  display: flex;
  align-items: center;
  justify-content: center;
}

.stage-container {
  position: relative;
  width: 100%;
  height: 100%;
  z-index: 1;
}

.stage-frame {
  position: absolute;
  inset: 0;
  border: 3px solid #000000;
  pointer-events: none;
  z-index: 101;
  display: none;
}

.room {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  perspective: 1000px;
  perspective-origin: 50% 40%;
}

.room-box {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: opacity 300ms ease-out, filter 300ms ease-out;
}

.room-box.transitioning {
  opacity: 0.2;
  filter: blur(3px) brightness(0.9);
}

.room-box.arriving {
  opacity: 0;
  filter: blur(4px) brightness(0.85);
}

.room-box.arriving.arriving-active {
  opacity: 1;
  filter: blur(0) brightness(1);
  transition: opacity 150ms ease-out, filter 150ms ease-out;
}

.wall {
  position: absolute;
  pointer-events: none;
}

.wall-ceiling {
  left: 0;
  top: 0;
  width: 100%;
  height: 32%;
  z-index: 6;
  background: linear-gradient(180deg, 
    rgba(238, 238, 235, 0.6) 0%,
    rgba(230, 230, 226, 0.75) 25%,
    rgba(220, 220, 213, 0.88) 50%,
    rgba(210, 210, 200, 0.95) 100%
  );
  box-shadow: inset 0 -50px 80px rgba(180, 180, 180, 0.06);
  clip-path: polygon(
    0 0,
    100% 0,
    calc(50% + var(--wall-back-width) / 2) 100%,
    calc(50% - var(--wall-back-width) / 2) 100%
  );
}

.wall-floor {
  left: 0;
  top: 70%;
  width: 100%;
  height: 30%;
  z-index: 6;
  position: relative;
  background: linear-gradient(180deg, 
    rgba(220, 220, 213, 1) 0%,
    rgba(210, 210, 200, 1) 25%,
    rgba(200, 200, 190, 1) 50%,
    rgba(190, 190, 180, 1) 100%
  );
  box-shadow: inset 0 40px 80px rgba(160, 160, 160, 0.1);
  clip-path: polygon(
    calc(50% - var(--wall-back-width) / 2) 0%,
    calc(50% + var(--wall-back-width) / 2) 0%,
    100% 100%,
    0 100%
  );
  pointer-events: none;
}

.wall-left {
  display: none;
}

.wall-right {
  display: none;
}

.wall-back {
  left: 50%;
  top: 50%;
  width: var(--wall-back-width);
  height: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
  background: linear-gradient(180deg, 
    #f0f0ed 0%,
    #ebebea 50%,
    #e5e5e1 100%
  );
  border: 1px solid rgba(140, 140, 140, 0.12);
  box-shadow: 
    inset 0 2px 4px rgba(255, 255, 255, 0.2),
    inset 0 -2px 4px rgba(140, 140, 140, 0.08),
    0 2px 6px rgba(120, 120, 120, 0.08);
}

.room-debug-label {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: "Shippori Mincho", serif;
  font-size: clamp(60px, 12vw, 120px);
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.06em;
  color: rgba(0, 0, 0, 0.3);
  text-shadow: 0 2px 0 rgba(255, 255, 255, 0.5);
  pointer-events: none;
  user-select: none;
  z-index: 4;
}

.room-debug-label[hidden] {
  display: none !important;
}

.door {
  position: absolute;
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  pointer-events: auto;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  z-index: 10;
}

.door[hidden] {
  display: none !important;
}

.door:focus-visible {
  outline: 1px solid rgba(100, 100, 100, 0.3);
  outline-offset: 3px;
}

.door:hover:not(.opening) {
  filter: brightness(0.98);
}

.door-shell {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: linear-gradient(180deg, 
    #f5f5f3 0%,
    #ececea 30%,
    #e0e0db 70%,
    #d5d5ce 100%
  );
  border: 1.5px solid rgba(120, 120, 120, 0.18);
  box-shadow: 
    inset 0 1px 0 rgba(255, 255, 255, 0.6),
    inset 0 -8px 12px rgba(100, 100, 100, 0.12),
    0 4px 12px rgba(100, 100, 100, 0.1);
  pointer-events: none;
}

.door-track {
  position: absolute;
  left: 5%;
  right: 5%;
  top: 2.5%;
  height: 1.5px;
  background: rgba(160, 160, 160, 0.1);
  z-index: 1;
}

.door-gap {
  position: absolute;
  left: 50%;
  top: 4%;
  bottom: 4%;
  width: 1px;
  transform: translateX(-50%);
  background: rgba(140, 140, 140, 0.15);
  transition: opacity 360ms ease;
  z-index: 2;
}

.door-panel {
  position: absolute;
  top: 2.5%;
  bottom: 2.5%;
  width: 49%;
  background: linear-gradient(180deg, 
    #fefefe 0%,
    #fcfcfb 40%,
    #f9f9f7 70%,
    #f4f4f1 100%
  );
  transition: none;
}

.door-panel::before {
  content: '';
  position: absolute;
  inset: 6%;
  border: 1px solid rgba(140, 140, 140, 0.08);
}

.door-panel-left {
  left: 0;
  border-right: 1px solid rgba(150, 150, 150, 0.1);
}

.door-panel-right {
  right: 0;
  border-left: 1px solid rgba(150, 150, 150, 0.1);
}

.door.opening .door-gap {
  opacity: 0.05;
}

.door.opening .door-panel-left {
  transform: translateX(-105%);
  transition: transform 1200ms cubic-bezier(0.4, 0, 0.2, 1);
}

.door.opening .door-panel-right {
  transform: translateX(105%);
  transition: transform 1200ms cubic-bezier(0.4, 0, 0.2, 1);
}

.door-front {
  left: 50%;
  top: 42%;
  width: clamp(50px, 12vw, 130px);
  height: clamp(120px, 45vh, 440px);
  transform: translateX(-50%);
  z-index: 3;
}

.door-left {
  left: 8%;
  top: 40%;
  width: clamp(50px, 7vw, 120px);
  height: clamp(140px, 60vh, 480px);
  z-index: 1;
  transform: scaleY(0.95);
  opacity: 0.95;
}

.door-right {
  right: 8%;
  top: 40%;
  width: clamp(50px, 7vw, 120px);
  height: clamp(140px, 60vh, 480px);
  z-index: 1;
  transform: scaleY(0.95);
  opacity: 0.95;
}

.door-hit-left,
.door-hit-right {
  position: absolute;
  z-index: 7;
  cursor: pointer;
  background: transparent;
  pointer-events: auto;
}

.door-hit-left {
  left: 8%;
  top: 40%;
  width: clamp(50px, 7vw, 120px);
  height: clamp(140px, 60vh, 480px);
}

.door-hit-right {
  right: 8%;
  top: 40%;
  width: clamp(50px, 7vw, 120px);
  height: clamp(140px, 60vh, 480px);
}

.bottom-ui {
  position: relative;
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 28px 20px max(28px, env(safe-area-inset-bottom));
  flex-shrink: 0;
  background: #ffffff;
}

.bottom-buttons {
  display: flex;
  gap: 20px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}

.message {
  display: none;
}

.reset-btn {
  appearance: none;
  margin: 0;
  padding: 10px 20px;
  border: 2px solid #000000;
  background: transparent;
  color: #000000;
  font-family: "Noto Sans JP", sans-serif;
  font-size: 16px;
  letter-spacing: 0.02em;
  cursor: pointer;
  pointer-events: auto;
  touch-action: manipulation;
  transition: background 180ms ease, color 180ms ease;
  border-radius: 8px;
}

.reset-btn:hover {
  background: rgba(0, 0, 0, 0.05);
  color: #000000;
}

.reset-btn:focus-visible {
  outline: 1px solid rgba(100, 100, 100, 0.3);
  outline-offset: 3px;
}

.reset-from-stage2-btn {
  appearance: none;
  margin: 0;
  padding: 10px 20px;
  border: 2px solid #000000;
  background: transparent;
  color: #000000;
  font-family: "Noto Sans JP", sans-serif;
  font-size: 16px;
  letter-spacing: 0.02em;
  cursor: pointer;
  pointer-events: auto;
  touch-action: manipulation;
  transition: background 180ms ease, color 180ms ease;
  border-radius: 8px;
  display: none;
}

.reset-from-stage2-btn:hover {
  background: rgba(0, 0, 0, 0.05);
  color: #000000;
}

.reset-from-stage2-btn:focus-visible {
  outline: 1px solid rgba(100, 100, 100, 0.3);
  outline-offset: 3px;
}

.reset-from-stage2-btn.show {
  display: block;
}

.version-badge {
  margin: 2px 0 0;
  padding: 0;
  font-size: 9px;
  letter-spacing: 0.1em;
  color: rgba(130, 130, 130, 0.2);
  pointer-events: none;
}

.clear-overlay {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(250, 250, 249, 0.88);
  opacity: 0;
  visibility: hidden;
  transition: opacity 280ms ease, visibility 280ms ease;
  z-index: 200;
  backdrop-filter: blur(2px);
}

.clear-overlay.show {
  opacity: 1;
  visibility: visible;
}

.clear-inner {
  min-width: min(80vw, 300px);
  padding: 40px 30px;
  text-align: center;
  background: rgba(255, 255, 255, 0.7);
  border: 1px solid rgba(160, 160, 160, 0.15);
  box-shadow: 
    0 8px 32px rgba(150, 150, 150, 0.08),
    inset 0 1px 0 rgba(255, 255, 255, 0.8);
}

.clear-title {
  margin: 0 0 16px;
  font-family: "Shippori Mincho", serif;
  font-size: clamp(28px, 5vw, 40px);
  font-weight: 700;
  letter-spacing: 0.15em;
  color: rgba(60, 60, 60, 0.8);
}

.clear-text {
  margin: 0 0 24px;
  font-size: 13px;
  line-height: 1.8;
  letter-spacing: 0.02em;
  color: rgba(80, 80, 80, 0.6);
}

.again-btn {
  appearance: none;
  padding: 10px 20px;
  border: 1px solid rgba(140, 140, 140, 0.25);
  background: rgba(255, 255, 255, 0.5);
  color: rgba(60, 60, 60, 0.7);
  font-family: "Noto Sans JP", sans-serif;
  font-size: 12px;
  letter-spacing: 0.02em;
  cursor: pointer;
  pointer-events: auto;
  touch-action: manipulation;
  transition: background 180ms ease, color 180ms ease;
}

.again-btn:hover {
  background: rgba(255, 255, 255, 0.7);
  color: rgba(40, 40, 40, 0.8);
}

.again-btn:focus-visible {
  outline: 1px solid rgba(100, 100, 100, 0.3);
  outline-offset: 3px;
}

.goal-message {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 150;
  pointer-events: none;
  opacity: 0;
  transition: opacity 280ms ease;
}

.goal-message.show {
  opacity: 1;
}

.goal-message-text {
  font-size: clamp(24px, 6vw, 40px);
  font-weight: 500;
  letter-spacing: 0.02em;
  color: rgba(60, 60, 60, 0.85);
  line-height: 1.8;
}

.confirm-overlay {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(250, 250, 249, 0.88);
  opacity: 0;
  visibility: hidden;
  transition: opacity 280ms ease, visibility 280ms ease;
  z-index: 200;
  backdrop-filter: blur(2px);
}

.confirm-overlay.show {
  opacity: 1;
  visibility: visible;
}

.confirm-inner {
  min-width: min(80vw, 300px);
  padding: 40px 30px;
  text-align: center;
  background: rgba(255, 255, 255, 0.7);
  border: 1px solid rgba(160, 160, 160, 0.15);
  box-shadow: 
    0 8px 32px rgba(150, 150, 150, 0.08),
    inset 0 1px 0 rgba(255, 255, 255, 0.8);
}

.confirm-text {
  margin: 0 0 24px;
  font-size: 16px;
  line-height: 1.8;
  letter-spacing: 0.02em;
  color: rgba(80, 80, 80, 0.8);
}

.confirm-buttons {
  display: flex;
  gap: 12px;
  justify-content: center;
}

.confirm-btn {
  appearance: none;
  padding: 10px 24px;
  border: 1px solid rgba(140, 140, 140, 0.25);
  background: rgba(255, 255, 255, 0.5);
  color: rgba(60, 60, 60, 0.7);
  font-family: "Noto Sans JP", sans-serif;
  font-size: 14px;
  letter-spacing: 0.02em;
  cursor: pointer;
  pointer-events: auto;
  touch-action: manipulation;
  transition: background 180ms ease, color 180ms ease;
  border-radius: 4px;
}

.confirm-btn:hover {
  background: rgba(255, 255, 255, 0.7);
  color: rgba(40, 40, 40, 0.8);
}

.confirm-btn:focus-visible {
  outline: 1px solid rgba(100, 100, 100, 0.3);
  outline-offset: 3px;
}

.confirm-btn-yes {
  background: rgba(100, 150, 200, 0.2);
  border-color: rgba(100, 150, 200, 0.4);
}

.confirm-btn-yes:hover {
  background: rgba(100, 150, 200, 0.3);
}

@media (max-width: 768px) {
  .instruction {
    font-size: 15px;
    padding: max(14px, env(safe-area-inset-top)) 16px 10px;
    flex-shrink: 0;
    min-height: 100px;
    line-height: 1.8;
  }

  .stage {
    width: 100%;
    max-width: 100%;
    aspect-ratio: 1 / 1;
    padding: 0;
  }

  .stage-frame {
    display: block;
  }

  .door-front {
    height: clamp(120px, 45vh * 1.2, 440px);
    top: 42%;
  }

  .door-left {
    top: 40%;
    left: 6%;
  }

  .door-right {
    top: 40%;
    right: 6%;
  }

  .door-left,
  .door-right {
    height: clamp(140px, 60vh * 1.2, 480px);
  }

  .door-hit-left,
  .door-hit-right {
    height: clamp(140px, 60vh * 1.2, 480px);
    top: 40%;
  }

  .door-hit-left {
    left: 6%;
  }

  .door-hit-right {
    right: 6%;
  }

  .reset-btn {
    font-size: 14px;
    padding: 8px 16px;
  }

  .reset-from-stage2-btn {
    font-size: 14px;
    padding: 8px 16px;
  }
}

@media (max-width: 480px) {
  .instruction {
    font-size: 13px;
    padding: max(12px, env(safe-area-inset-top)) 14px 8px;
  }

  .wall-left {
    clip-path: polygon(0 0, 100% 32%, 100% 56%, 0 100%);
  }

  .wall-right {
    clip-path: polygon(0 32%, 100% 0, 100% 100%, 0 56%);
  }

  .reset-btn {
    font-size: 12px;
    padding: 6px 12px;
  }

  .reset-from-stage2-btn {
    font-size: 12px;
    padding: 6px 12px;
  }

  .bottom-buttons {
    gap: 10px;
  }
}
</style>

<body>

<div class="wrap">
  <p class="instruction" id="instruction">この部屋から最短で<br>その部屋へ向かってください。</p>
  
  <div class="stage" id="stage" aria-live="polite">
    <div class="stage-container" id="stageContainer">
      <div class="room" id="room">
        <div class="room-box" id="roomBox">
          <div class="wall wall-ceiling"></div>
          <div class="wall wall-floor"></div>
          <div class="wall wall-left"></div>
          <div class="wall wall-right"></div>
          <div class="wall wall-back"></div>

          <div class="room-debug-label" id="roomDebug" hidden></div>

          <button class="door door-front" id="doorFront" type="button" aria-label="正面の扉" hidden>
            <div class="door-shell">
              <div class="door-track"></div>
              <div class="door-panel door-panel-left"></div>
              <div class="door-panel door-panel-right"></div>
              <div class="door-gap"></div>
            </div>
          </button>

          <button class="door door-left" id="doorLeft" type="button" aria-label="左の扉" hidden>
            <div class="door-shell">
              <div class="door-track"></div>
              <div class="door-panel door-panel-left"></div>
              <div class="door-panel door-panel-right"></div>
              <div class="door-gap"></div>
            </div>
          </button>

          <button class="door door-right" id="doorRight" type="button" aria-label="右の扉" hidden>
            <div class="door-shell">
              <div class="door-track"></div>
              <div class="door-panel door-panel-left"></div>
              <div class="door-panel door-panel-right"></div>
              <div class="door-gap"></div>
            </div>
          </button>

          <div class="door-hit-left" id="doorHitLeft"></div>
          <div class="door-hit-right" id="doorHitRight"></div>
        </div>
      </div>
      <div class="stage-frame" id="stageFrame"></div>
    </div>
  </div>

  <div class="bottom-ui">
    <div class="bottom-buttons">
      <button class="reset-btn" id="resetBtn" type="button">この部屋に戻る</button>
      <button class="reset-from-stage2-btn" id="resetFromStage2Btn" type="button">初めから遊ぶ</button>
    </div>
    <p class="version-badge" id="versionBadge">build v7.0</p>
  </div>
</div>

<div class="clear-overlay" id="clearOverlay">
  <div class="clear-inner">
    <p class="clear-title">CLEAR</p>
    <p class="clear-text" id="clearText">あなたはそこの部屋を巡った。</p>
    <button class="again-btn" id="againBtn" type="button">次へ</button>
  </div>
</div>

<div class="goal-message" id="goalMessage">
  <p class="goal-message-text" id="goalMessageText">あの部屋を経由してください</p>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-inner">
    <p class="confirm-text">本当に始めから遊びますか？</p>
    <div class="confirm-buttons">
      <button class="confirm-btn confirm-btn-yes" id="confirmYesBtn" type="button">はい</button>
      <button class="confirm-btn" id="confirmNoBtn" type="button">いいえ</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var GRID = [
    ['ん', 'わ', 'ら', 'や', 'ま', 'は', 'な', 'た', 'さ', 'か', 'あ'],
    [null, null, 'り', null, 'み', 'ひ', 'に', 'ち', 'し', 'き', 'い'],
    [null, null, 'る', 'ゆ', 'む', 'ふ', 'ぬ', 'つ', 'す', 'く', 'う'],
    [null, null, 'れ', null, 'め', 'へ', 'ね', 'て', 'せ', 'け', 'え'],
    [null, 'を', 'ろ', 'よ', 'も', 'ほ', 'の', 'と', 'そ', 'こ', 'お']
  ];

  var ROWS = GRID.length;
  var COLS = GRID[0].length;
  var STORAGE_KEY = 'asoko_state_v7_0';
  var BUILD_LABEL = 'build v7.0';
  var DEBUG_LABELS = true;
  var OPEN_MS = 1200;

  var DELTAS = [
    { dr: -1, dc: 0 },
    { dr: 0, dc: 1 },
    { dr: 1, dc: 0 },
    { dr: 0, dc: -1 }
  ];

  function findCell(letter) {
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        if (GRID[r][c] === letter) return { row: r, col: c };
      }
    }
    return null;
  }

  var START = findCell('こ');
  var VIA = findCell('あ');
  var GOAL = findCell('そ');
  var SHORTEST = 0;
  var state;
  var moving = false;
  var currentMode = 1;

  function getCell(r, c) {
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
    return GRID[r][c];
  }

  function isRoom(r, c) {
    return getCell(r, c) !== null;
  }

  function freshState() {
    return {
      row: START.row,
      col: START.col,
      facing: 0,
      moveCount: 0,
      visitedVia: false,
      goalMessage: null
    };
  }

  function normalizeState(raw) {
    if (!raw) return freshState();
    if (
      typeof raw.row !== 'number' ||
      typeof raw.col !== 'number' ||
      typeof raw.facing !== 'number' ||
      !isRoom(raw.row, raw.col)
    ) return freshState();
    return {
      row: raw.row,
      col: raw.col,
      facing: ((raw.facing % 4) + 4) % 4,
      moveCount: typeof raw.moveCount === 'number' ? raw.moveCount : 0,
      visitedVia: !!raw.visitedVia,
      goalMessage: null
    };
  }

  function loadState() {
    try {
      return normalizeState(JSON.parse(localStorage.getItem(STORAGE_KEY)));
    } catch (e) {
      return freshState();
    }
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { }
  }

  function roomName(st) {
    return getCell(st.row, st.col);
  }

  var EXIT_OVERRIDES = {
    'わ': ['front'],
    'を': [],
    'ん': []
  };

  function canMoveTo(st, nr, nc) {
    var dest = getCell(nr, nc);
    if (dest === null) return false;
    return true;
  }

  function standardMoves(st) {
    var defs = [
      { kind: 'front', dir: st.facing },
      { kind: 'left', dir: (st.facing + 3) % 4 },
      { kind: 'right', dir: (st.facing + 1) % 4 }
    ];
    var out = [];
    for (var i = 0; i < defs.length; i++) {
      var d = defs[i].dir;
      var nr = st.row + DELTAS[d].dr;
      var nc = st.col + DELTAS[d].dc;
      if (canMoveTo(st, nr, nc)) {
        out.push({ kind: defs[i].kind, dir: d, row: nr, col: nc });
      }
    }
    return out;
  }

  function availableMoves(st) {
    var name = roomName(st);
    var override = EXIT_OVERRIDES[name];
    if (!override) return standardMoves(st);

    var defs = {
      front: st.facing,
      left: (st.facing + 3) % 4,
      right: (st.facing + 1) % 4
    };
    var out = [];
    for (var i = 0; i < override.length; i++) {
      var item = override[i];
      var kind = typeof item === 'string' ? item : item.kind;
      var d = (item && typeof item.absDir === 'number') ? item.absDir : defs[kind];
      var nr = st.row + DELTAS[d].dr;
      var nc = st.col + DELTAS[d].dc;
      if (canMoveTo(st, nr, nc)) {
        out.push({ kind: kind, dir: d, row: nr, col: nc });
      }
    }
    return out;
  }

  function moveMap(st) {
    var m = { front: null, left: null, right: null };
    var list = availableMoves(st);
    for (var i = 0; i < list.length; i++) m[list[i].kind] = list[i];
    return m;
  }

  function key(r, c, f) {
    return ((r * COLS) + c) * 4 + f;
  }

  function bfsDist(startState) {
    var dist = [];
    for (var i = 0; i < ROWS * COLS * 4; i++) dist[i] = -1;

    var q = [];
    var startKey = key(startState.row, startState.col, startState.facing);
    dist[startKey] = 0;
    q.push(startKey);

    for (var head = 0; head < q.length; head++) {
      var cur = q[head];
      var f = cur % 4;
      var rc = (cur - f) / 4;
      var c = rc % COLS;
      var r = (rc - c) / COLS;
      var here = { row: r, col: c, facing: f };
      var nexts = availableMoves(here);
      for (var j = 0; j < nexts.length; j++) {
        var mv = nexts[j];
        var nk = key(mv.row, mv.col, mv.dir);
        if (dist[nk] === -1) {
          dist[nk] = dist[cur] + 1;
          q.push(nk);
        }
      }
    }
    return dist;
  }

  function shortestTotal() {
    var d = bfsDist({ row: START.row, col: START.col, facing: 0 });
    var best = Infinity;
    for (var vf = 0; vf < 4; vf++) {
      var toVia = d[key(VIA.row, VIA.col, vf)];
      if (toVia === -1) continue;
      var viaState = { row: VIA.row, col: VIA.col, facing: vf };
      var dv = bfsDist(viaState);
      for (var gf = 0; gf < 4; gf++) {
        var toGoal = dv[key(GOAL.row, GOAL.col, gf)];
        if (toGoal === -1) continue;
        if (toVia + toGoal < best) best = toVia + toGoal;
      }
    }
    return best;
  }

  var instructionEl = document.getElementById('instruction');
  var stageEl = document.getElementById('stage');
  var stageContainerEl = document.getElementById('stageContainer');
  var roomEl = document.getElementById('room');
  var roomBoxEl = document.getElementById('roomBox');
  var roomDebugEl = document.getElementById('roomDebug');
  var doorFrontEl = document.getElementById('doorFront');
  var doorLeftEl = document.getElementById('doorLeft');
  var doorRightEl = document.getElementById('doorRight');
  var doorHitLeftEl = document.getElementById('doorHitLeft');
  var doorHitRightEl = document.getElementById('doorHitRight');

  var resetBtn = document.getElementById('resetBtn');
  var clearOverlay = document.getElementById('clearOverlay');
  var clearTextEl = document.getElementById('clearText');
  var againBtn = document.getElementById('againBtn');
  var versionBadgeEl = document.getElementById('versionBadge');
  var goalMessageEl = document.getElementById('goalMessage');
  var goalMessageTextEl = document.getElementById('goalMessageText');
  var resetFromStage2Btn = document.getElementById('resetFromStage2Btn');
  var confirmOverlay = document.getElementById('confirmOverlay');
  var confirmYesBtn = document.getElementById('confirmYesBtn');
  var confirmNoBtn = document.getElementById('confirmNoBtn');
  var doorEls = { front: doorFrontEl, left: doorLeftEl, right: doorRightEl };

  function clearDoorAnimation() {
    doorFrontEl.classList.remove('opening');
    doorLeftEl.classList.remove('opening');
    doorRightEl.classList.remove('opening');
  }

  function render() {
    var currentRoom = roomName(state) || '';
    if (versionBadgeEl) versionBadgeEl.textContent = BUILD_LABEL;
    if (roomDebugEl) {
      roomDebugEl.textContent = DEBUG_LABELS ? currentRoom : '';
      roomDebugEl.hidden = !DEBUG_LABELS;
    }
    var doors = moveMap(state);

    doorFrontEl.hidden = !doors.front;
    doorLeftEl.hidden = !doors.left;
    doorRightEl.hidden = !doors.right;
    
    doorHitLeftEl.style.display = !doors.left ? 'none' : 'block';
    doorHitRightEl.style.display = !doors.right ? 'none' : 'block';
  }

  function showClear() {
    clearOverlay.classList.add('show');
  }

  function hideClear() {
    clearOverlay.classList.remove('show');
  }

  function updateUIForMode() {
    if (currentMode === 2) {
      resetFromStage2Btn.classList.add('show');
    } else {
      resetFromStage2Btn.classList.remove('show');
    }
  }

  function showGoalMessage(text) {
    goalMessageTextEl.textContent = text;
    goalMessageEl.classList.add('show');
  }

  function hideGoalMessage() {
    goalMessageEl.classList.remove('show');
  }

  function showConfirm() {
    confirmOverlay.classList.add('show');
  }

  function hideConfirm() {
    confirmOverlay.classList.remove('show');
  }

  function checkGoal() {
    if (state.row === GOAL.row && state.col === GOAL.col) {
      if (currentMode === 1) {
        if (state.moveCount !== 1) {
          showGoalMessage('最短経路ではありません');
        } else {
          clearTextEl.textContent = 'あなたはそこの部屋を巡った。';
          againBtn.textContent = '次へ';
          showClear();
          updateUIForMode();
        }
      } else if (currentMode === 2) {
        if (!state.visitedVia) {
          showGoalMessage('あの部屋を経由してください');
        } else if (state.moveCount !== SHORTEST) {
          showGoalMessage('最短経路ではありません');
        } else {
          clearTextEl.textContent = 'あなたはあそこの部屋を巡った。';
          againBtn.textContent = 'もう一度あそぶ';
          showClear();
          updateUIForMode();
        }
      }
    }
  }

  function applyMove(mv) {
    state.row = mv.row;
    state.col = mv.col;
    state.facing = mv.dir;
    state.moveCount += 1;
    if (state.row === VIA.row && state.col === VIA.col) state.visitedVia = true;
    checkGoal();
    saveState();
    render();
  }

  function getFloorY() {
    var containerRect = stageContainerEl.getBoundingClientRect();
    return containerRect.top + containerRect.height * 0.70;
  }

  function pressDoor(kind) {
    if (moving) return;
    var mv = moveMap(state)[kind];
    if (!mv) return;

    moving = true;
    hideGoalMessage();
    
    clearDoorAnimation();
    var door = doorEls[kind];
    if (door) door.classList.add('opening');

    window.setTimeout(function () {
      roomBoxEl.style.filter = 'blur(3px) brightness(0.9)';
      
      window.setTimeout(function () {
        applyMove(mv);
        
        window.setTimeout(function () {
          roomBoxEl.style.filter = 'blur(0) brightness(1)';
          clearDoorAnimation();
          moving = false;
        }, 300);
      }, 50);
    }, OPEN_MS - 100);
  }

  function pressDoorWithFloorCheck(kind, clickY) {
    var floorY = getFloorY();
    if (clickY >= floorY) {
      return;
    }
    pressDoor(kind);
  }

  function resetGame() {
    moving = false;
    clearDoorAnimation();
    hideGoalMessage();
    roomBoxEl.classList.remove('transitioning');
    roomBoxEl.classList.remove('arriving');
    roomBoxEl.classList.remove('arriving-active');
    roomBoxEl.style.filter = 'blur(0) brightness(1)';
    state = freshState();
    hideClear();
    updateUIForMode();
    saveState();
    render();
  }

  function nextMode() {
    if (currentMode === 1) {
      currentMode = 2;
      instructionEl.innerHTML = 'この部屋から最短であの部屋を経由して<br>その部屋へ向かってください。';
      resetGame();
    } else {
      currentMode = 1;
      instructionEl.innerHTML = 'この部屋から最短で<br>その部屋へ向かってください。';
      resetGame();
    }
  }

  function resetToStage1() {
    currentMode = 1;
    instructionEl.innerHTML = 'この部屋から最短で<br>その部屋へ向かってください。';
    resetGame();
  }

  doorFrontEl.addEventListener('click', function () { pressDoor('front'); });
  doorLeftEl.addEventListener('click', function (e) { pressDoorWithFloorCheck('left', e.clientY); });
  doorRightEl.addEventListener('click', function (e) { pressDoorWithFloorCheck('right', e.clientY); });
  doorHitLeftEl.addEventListener('click', function (e) { pressDoorWithFloorCheck('left', e.clientY); });
  doorHitRightEl.addEventListener('click', function (e) { pressDoorWithFloorCheck('right', e.clientY); });
  resetBtn.addEventListener('click', resetGame);
  againBtn.addEventListener('click', nextMode);
  resetFromStage2Btn.addEventListener('click', showConfirm);
  confirmYesBtn.addEventListener('click', function() {
    hideConfirm();
    resetToStage1();
  });
  confirmNoBtn.addEventListener('click', hideConfirm);

  SHORTEST = shortestTotal();
  state = freshState();
  render();
})();
</script>

</body>
</html>
